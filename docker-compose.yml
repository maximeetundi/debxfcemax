# ============================================================
#  ExenKit Desktop — Debian 13 XFCE Full Dev Stack
#  noVNC : http://localhost:6515
#  VNC   : localhost:5900
# ============================================================

services:
  exenkit:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - INSTALL_FIREFOX=${INSTALL_FIREFOX:-true}
        - INSTALL_VLC=${INSTALL_VLC:-true}
        - INSTALL_JAVA=${INSTALL_JAVA:-true}
        - INSTALL_NODEJS=${INSTALL_NODEJS:-true}
        - INSTALL_WINDSURF=${INSTALL_WINDSURF:-true}
        - INSTALL_XDM=${INSTALL_XDM:-true}
        - INSTALL_CLAUDE=${INSTALL_CLAUDE:-true}
        - INSTALL_CODEX=${INSTALL_CODEX:-true}
    image: exenkit:latest
    container_name: exenkit-desktop
    hostname: exenkit
    restart: unless-stopped

    ports:
      - "6515:6515"   # noVNC Web UI  → http://localhost:6515
      - "5900:5900"   # VNC direct    → port 5900

    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-ExenKit2025!}
      - RESOLUTION=${RESOLUTION:-1920x1080x24}
      - TZ=${TZ:-Africa/Douala}
      - LANG=fr_FR.UTF-8
      # Optionnelles — Claude Code & Codex fonctionnent sans ces clés au démarrage
      # Renseignez-les dans .env ou directement dans le terminal du container
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

    volumes:
      - exenkit-home:/root
      - exenkit-projects:/workspace
      - /dev/shm:/dev/shm

    shm_size: '2gb'

    security_opt:
      - seccomp:unconfined

    cap_add:
      - SYS_ADMIN

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6515"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  exenkit-home:
    driver: local
  exenkit-projects:
    driver: local

networks:
  default:
    name: exenkit-net
