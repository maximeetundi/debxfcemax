# ============================================================
#  Supervisord — ExenKit Process Manager
#  Gère : Xvfb → XFCE → x11vnc → noVNC
# ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ─── 1. Serveur X Virtuel ────────────────────────────────────
[program:xvfb]
command=Xvfb :1 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset -dpi 96
environment=HOME="/root"
priority=10
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

# ─── 2. Gestionnaire DBus ─────────────────────────────────────
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=15
autorestart=true
startsecs=2
startretries=3
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus.log

# ─── 3. Bureau XFCE ──────────────────────────────────────────
[program:xfce4]
command=/scripts/start-xfce.sh
environment=DISPLAY=":1",HOME="/root",USER="root",DBUS_SESSION_BUS_ADDRESS="autolaunch:",XDG_RUNTIME_DIR="/tmp/runtime-root"
priority=20
autorestart=true
startsecs=8
startretries=3
stdout_logfile=/var/log/supervisor/xfce4.log
stderr_logfile=/var/log/supervisor/xfce4.log

# ─── 4. Serveur VNC (x11vnc) ─────────────────────────────────
[program:x11vnc]
command=/scripts/start-vnc.sh
environment=DISPLAY=":1",HOME="/root"
priority=30
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

# ─── 5. noVNC (WebSocket → VNC) ──────────────────────────────
[program:novnc]
command=/scripts/start-novnc.sh
environment=HOME="/root"
priority=40
autorestart=true
startsecs=12
startretries=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log
