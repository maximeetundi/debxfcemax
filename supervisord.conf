# ============================================================
#  Supervisord — ExenKit Process Manager
#  Gère : Xvfb → XFCE → x11vnc → noVNC
# ============================================================

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ─── 1. Serveur X Virtuel ────────────────────────────────────
[program:xvfb]
command=Xvfb :1 -screen 0 %(ENV_RESOLUTION)s -ac +extension GLX +render -noreset -dpi 96
user=exenkit
environment=HOME="/home/exenkit",USER="exenkit"
priority=10
autorestart=true
startsecs=2
startretries=5
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

# ─── 2. Bureau LXQt ──────────────────────────────────────────
[program:lxqt]
command=/scripts/start-lxqt.sh
user=exenkit
environment=DISPLAY=":1",HOME="/home/exenkit",USER="exenkit",XDG_RUNTIME_DIR="/tmp/runtime-exenkit",RESOLUTION="%(ENV_RESOLUTION)s"
priority=20
autorestart=true
startsecs=8
startretries=3
stdout_logfile=/var/log/supervisor/lxqt.log
stderr_logfile=/var/log/supervisor/lxqt.log

# ─── 3. Serveur VNC (x11vnc) ─────────────────────────────────
[program:x11vnc]
command=/scripts/start-vnc.sh
user=exenkit
environment=DISPLAY=":1",HOME="/home/exenkit",USER="exenkit",RESOLUTION="%(ENV_RESOLUTION)s"
priority=30
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

# ─── 4. noVNC (WebSocket → VNC) ──────────────────────────────
[program:novnc]
command=/scripts/start-novnc.sh
user=exenkit
environment=HOME="/home/exenkit",USER="exenkit"
priority=40
autorestart=true
startsecs=12
startretries=5
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

